<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML y JS Común</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <nav>
        <a href="index.html">⬅️ Volver al Inicio</a>
    </nav>

    <h2>Carga de Personas (JS Básico)</h2>

    <form id="form-persona">
        <div>
            <label>Nombre:</label>
            <input type="text" id="nombre" required>
        </div>
        <div>
            <label>Apellido:</label>
            <input type="text" id="apellido" required>
        </div>
        <div>
            <label>Edad:</label>
            <input type="number" id="edad" required>
        </div>
        <div>
            <label>Altura (en metros, ej: 1.80):</label>
            <input type="number" step="0.01" id="altura" required>
        </div>
        <div>
            <label>Peso (en kg):</label>
            <input type="number" step="0.1" id="peso" required>
        </div>
        <button type="submit">Agregar Persona</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Edad</th>
                <th>Altura</th>
                <th>Peso</th>
                <th>IMC</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla-cuerpo">
            </tbody>
    </table>

    <script src="JS/personas.js"></script>

</body>
</html>
