<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML y JS Común</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <nav>
        <a href="index.html">⬅️ Volver al Inicio</a>
    </nav>

    <h2>Carga de Personas (JS Básico)</h2>

    <form id="form-persona">
        <div>
            <label>Nombre:</label>
            <input type="text" id="nombre" required>
        </div>
        <div>
            <label>Apellido:</label>
            <input type="text" id="apellido" required>
        </div>
        <div>
            <label>Edad:</label>
            <input type="number" id="edad" required>
        </div>
        <div>
            <label>Altura (en metros, ej: 1.80):</label>
            <input type="number" step="0.01" id="altura" required>
        </div>
        <div>
            <label>Peso (en kg):</label>
            <input type="number" step="0.1" id="peso" required>
        </div>
        <button type="submit">Agregar Persona</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Edad</th>
                <th>Altura</th>
                <th>Peso</th>
                <th>IMC</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla-cuerpo">
            </tbody>
    </table>

    <script>
        const form = document.getElementById('form-persona');
        const tablaCuerpo = document.getElementById('tabla-cuerpo');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Captura de datos
            const nombre = document.getElementById('nombre').value;
            const apellido = document.getElementById('apellido').value;
            const edad = document.getElementById('edad').value;
            const altura = parseFloat(document.getElementById('altura').value);
            const peso = parseFloat(document.getElementById('peso').value);

            // Calcular IMC
            const imc = (peso / (altura * altura)).toFixed(2);

            // Crear fila
            const fila = document.createElement('tr');
            fila.innerHTML = `
                <td>${nombre}</td>
                <td>${apellido}</td>
                <td>${edad}</td>
                <td>${altura} m</td>
                <td>${peso} kg</td>
                <td><strong>${imc}</strong></td>
                <td><button class="btn-delete">Quitar</button></td>
            `;

            // Evento para eliminar la fila específica
            fila.querySelector('.btn-delete').addEventListener('click', function() {
                fila.remove();
            });

            // Agregar a la tabla
            tablaCuerpo.appendChild(fila);

            // Limpiar formulario
            form.reset();
        });
    </script>
</body>
</html>
